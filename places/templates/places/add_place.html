{% extends 'places/base.html' %}

{% block title %}Додати нове місце{% endblock %}

{% block content %}
<h2>Додати нове улюблене місце</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div>
        <label for="name">Назва місця*:</label><br>
        <input type="text" id="name" name="name" value="{{ data.name|default:'' }}">
        {% if errors.name %}<span style="color:red;">{{ errors.name }}</span>{% endif %}
    </div>

    <div>
        <label for="type">Тип:</label><br>
        <input type="text" id="type" name="type" value="{{ data.type|default:'' }}">
    </div>

    <div>
        <label for="location">Локація:</label><br>
        <input type="text" id="location" name="location" value="{{ data.location|default:'' }}">
    </div>

    <div>
        <label for="rating">Рейтинг (1-5)*:</label><br>
        <input type="number" id="rating" name="rating" min="1" max="5" value="{{ data.rating|default:'5' }}">
        {% if errors.rating %}<span style="color:red;">{{ errors.rating }}</span>{% endif %}
    </div>

    <div>
        <label for="image">Зображення:</label><br>
        <input type="file" id="image" name="image" accept="image/*">
    </div>

    <div>
        <label for="description">Опис:</label><br>
        <textarea id="description" name="description" rows="4">{{ data.description|default:'' }}</textarea>
    </div>

    <br>
    <button type="submit">Зберегти місце</button>
</form>
{% endblock %}
